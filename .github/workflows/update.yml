name: update
# Written 13 Nov 2026 from Orbit's update.yml. It deploys nothing until the Cloudflare Pages project `launch`
# exists and the secrets below are set.
#
# Every 6 hours at :11 (offset from Orbit :41, Headwind :23, Blackout :53, COP :17), on every push to main, and by
# hand. Each run is short: three FAA TFR requests plus one XML per space-operations TFR (5 on 13 Nov 2026), and one
# request for Orbit's published snapshot. About 4 runs a day, a minute or two each.
#
# State: the last snapshot and the launch ledger are kept in this repository's private Actions cache, so a failed
# lane keeps its last good copy and every launch already seen stays. Each run merges the committed baseline
# (history/ledger.json, GCAT's launches since 2023), the cached ledger, the published copy
# (launch.theintelligence.company/data/ledger.json) and this run's launches from Orbit: a union, so a lost cache
# loses nothing. The charted notices (history/history.json, history/patterns.json) are committed and rebuilt
# only by `python tools/launch.py history` from a new export, on the machine that holds the private term file.
# The privacy check (launch/privacy.py) runs in the tests and in `launch.py check`: it fails the run on a
# listed term in site/ or in any tracked file.
#
# Secrets: CLOUDFLARE_PAGES_TOKEN and repo variable CLOUDFLARE_ACCOUNT_ID. No FAA NMS-API keys: Cordon is the
# suite's one NMS reader (18 Nov 2026), and the nms lane reads Cordon's published NOTAM subsets (launch/nms.py).
# The GPS/GNSS NOTAM files (launch/gnss.py, for Noisefloor) keep their state and day files in data/gnss/, cached
# with the rest. The ledger of every NMS closure notice ever kept (data/nms-closures.json) is not cached: each run
# unions it with the published copy and the release copy (ideas#222). Both are kept for good. Never change the path list below: actions/cache keys
# an entry's version on it, so a changed list finds no earlier state (19 Nov 2026, run 44461432466).
#
# Ascent move (19 Nov 2026): the schedule lane makes one Launch Library 2 upcoming request a run, the LL2 ledger one
# pull and at most one by-id lookup, and the news lane one Spaceflight News request. While Orbit's own LL2 lanes
# still run (1-2 an hour plus 4 a day) the two stay well under LL2's 15 requests an hour without a key. Their stores
# (the multi-source schedule, the LL2 ledger and the side-by-side check with Orbit) are kept for good on this
# repository's public release `ledger`, uploaded after collect; collect reads them back from there (a 404 is a
# first run; anything else with no local copy stops the run). That is why this job may write contents.
#
# Private archive (the last step): every run's source replies, run state, history/ and deployed site/ also go to the
# PRIVATE repo metacog-osint/tic-archive (tools/tic_archive.py), where nothing is replaced or deleted. When the
# Actions cache or release `ledger` lacks part of the state, the step before collect reads the newest archived copy
# back. Secret TIC_ARCHIVE_TOKEN: a fine-grained token with contents read/write on tic-archive only.
on:
  push:
    branches: [main]
  schedule:
    - cron: "11 */6 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v7
        with: { node-version: "22" }
      - name: Tests
        run: python -m unittest discover -s tests
      - name: Last run's state from the Actions cache (none on the first run)
        id: state
        uses: actions/cache/restore@v6
        with:
          path: |
            data/snapshot.json
            data/ledger.json
            data/gnss
          key: launch-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: launch-state-
      - name: Say so when there was no state
        if: steps.state.outputs.cache-matched-key == ''
        run: echo "::warning::No state in the Actions cache, so this run has no last good copy to fall back on."
      # The private archive's lane `state` holds the state of every run whose collect succeeded (the last step). It
      # is read back only when the Actions cache had no state or release `ledger` lacks one of the stores collect
      # reads from it (the Ascent stores are not in the cache). A file goes into data/ only where data/ has none, so
      # the cache's copies stay; collect then unions what is there with the release and the published copies, as
      # before. A restore that fails or is not possible never stops the run: those other sources still hold.
      - name: Fill gaps in the state from the private archive (when the cache or release `ledger` lacks them)
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE_TOKEN: ${{ secrets.TIC_ARCHIVE_TOKEN }}
          CACHED: ${{ steps.state.outputs.cache-matched-key }}
        run: |
          need=""
          [ -n "$CACHED" ] || need="no state in the Actions cache"
          have=$(gh release view ledger --json assets --jq '.assets[].name' 2>/dev/null || true)
          for f in upcoming-store.json ll2-ledger.json launch-ledger.json nms-closures.json; do
            printf '%s\n' "$have" | grep -qx "$f" || need="${need:+$need; }no $f on release ledger"
          done
          if [ -z "$need" ]; then echo "state: the cache and release ledger hold it; the archive is not read"; exit 0; fi
          echo "state: $need"
          if [ -z "$ARCHIVE_TOKEN" ]; then
            echo "::warning::secret TIC_ARCHIVE_TOKEN is not set, so no state was read back from the private archive"
            exit 0
          fi
          if GH_TOKEN="$ARCHIVE_TOKEN" python tools/tic_archive.py restore --program launch --lane state \
               --dest "$RUNNER_TEMP/archive-state"; then
            python - "$RUNNER_TEMP/archive-state" data <<'PY' || echo "::warning::the archived state was not copied into data/"
          import shutil, sys
          from pathlib import Path
          src, dest = Path(sys.argv[1]), Path(sys.argv[2])
          n = 0
          for p in sorted(src.rglob("*")):
              q = dest / p.relative_to(src)
              if p.is_file() and not q.exists():
                  q.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copyfile(p, q)
                  n += 1
          print(f"state: {n} files from the private archive, where data/ had none")
          PY
            echo "::warning::filled gaps in the state from the newest copy in the private archive ($need)"
          else
            echo "::warning::the private archive's state could not be read; collect goes on with the cache, release ledger and the published copies"
          fi
      - name: Live collection (a failed lane keeps its last good copy and says so on the page)
        id: collect
        run: python tools/launch.py collect
      - name: Keep the schedule, the LL2 ledger and the comparison for good (release `ledger`)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view ledger >/dev/null 2>&1 || gh release create ledger --title "Launch ledger" --latest=false \
            --notes "Launch's stores, kept for good: ll2-ledger.json (every launch since 1 Jan 2024 from Launch Library 2, The Space Devs, verified and extended each run; begun from Orbit's ledger, 19 Nov 2026), upcoming-store.json (every scheduled launch Launch has seen, one multi-source record each) and ascent-compare.json (the side-by-side check with Orbit's lanes). Launch data: Launch Library 2, The Space Devs (thespacedevs.com)."
          files=""
          for f in upcoming-store.json ll2-ledger.json ascent-compare.json; do
            if [ -f "data/$f" ]; then files="$files data/$f"; fi
          done
          if [ -n "$files" ]; then gh release upload ledger $files --clobber; fi
      # The launch ledger and the NMS closure ledger lived only on the site and in the Actions cache until 24 Nov 2026
      # (ideas#222). Now the newest copy goes to release `ledger` (collect reads it back, so a lost cache or a site
      # that answers 404 restores from it), and one dated copy a day to release `ledger-YYYY-qN`, kept for good (about
      # 184 assets a quarter against the 1,000 limit; a same-day run replaces that day's copy). Nothing is deleted.
      - name: Keep the launch ledger and the NMS closure ledger for good (releases `ledger` and `ledger-YYYY-qN`)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          out=data/release-copy
          mkdir -p "$out"
          day=$(date -u +%Y-%m-%d)
          now=""
          dated=""
          if [ -f data/ledger.json ]; then
            cp data/ledger.json "$out/launch-ledger.json"
            cp data/ledger.json "$out/launch-ledger-$day.json"
            now="$now $out/launch-ledger.json"; dated="$dated $out/launch-ledger-$day.json"
          fi
          if [ -f data/nms-closures.json ]; then
            cp data/nms-closures.json "$out/nms-closures.json"
            cp data/nms-closures.json "$out/nms-closures-$day.json"
            now="$now $out/nms-closures.json"; dated="$dated $out/nms-closures-$day.json"
          fi
          if [ -n "$now" ]; then gh release upload ledger $now --clobber; fi
          if [ -n "$dated" ]; then
            q="ledger-$(date -u +%Y)-q$(( (10#$(date -u +%m) - 1) / 3 + 1 ))"
            gh release view "$q" >/dev/null 2>&1 || gh release create "$q" --prerelease --latest=false --title "$q" \
              --notes "Launch's dated copies for one quarter, kept for good (nothing is deleted): launch-ledger-YYYY-MM-DD.json (every launch Launch holds, with its closures) and nms-closures-YYYY-MM-DD.json (every NOTAM closure notice Launch kept, read through Cordon from the FAA NOTAM service; not FAA data, and not authoritative for notices issued outside the United States). Public with the repository."
            gh release upload "$q" $dated --clobber
          fi
      - name: Build site/
        run: python tools/launch.py build
      - name: Feed check
        run: python tools/launch.py check
      - name: Keep this run's state for the next run
        uses: actions/cache/save@v6
        with:
          path: |
            data/snapshot.json
            data/ledger.json
            data/gnss
          key: launch-state-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Deploy site/ to Cloudflare Pages
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Cloudflare secrets not set; skipping deploy"; exit 0
          fi
          # Cloudflare's API fails now and then with nothing wrong here ("An unknown error occurred ... [code: 8000000]",
          # 01:15 UTC 22 Nov 2026), which failed the run and mailed an alert. Try three times, 20 s and 60 s apart.
          for wait in 0 20 60; do
            if [ "$wait" != 0 ]; then echo "::warning::Cloudflare deploy failed; trying again in ${wait} s"; sleep "$wait"; fi
            if npx --yes wrangler@4.151.3 pages deploy site --project-name launch --branch main \
                 --commit-hash "$GITHUB_SHA" --commit-message "update $GITHUB_SHA" --commit-dirty=true; then
              exit 0
            fi
          done
          echo "::error::Cloudflare Pages deploy failed three times"; exit 1
      # What this public repository discards, keeps only for a while or replaces goes to the PRIVATE repo
      # metacog-osint/tic-archive (tools/tic_archive.py), one lane each, release launch-<lane>-YYYY-MM: a snapshot per
      # run, only changed files uploaded, nothing replaced or deleted.
      #   raw      data/raw: this run's source replies and their fetch index, which the runner discards. Whenever
      #            collect fetched any, even in a run that failed later.
      #   state    data/ without data/raw and the release copies (byte copies of data/ files): the snapshot, the
      #            launch ledger, the NMS closure ledger, the GNSS NOTAM store and day files, and the Ascent stores.
      #            The Actions cache keeps them 7 days, release `ledger` replaces them each run, a same-day run
      #            replaces that day's dated copy, and the GNSS store trims its run log. Once collect succeeded; the
      #            step before collect reads this lane back.
      #   history  history/ as checked out: the committed baseline and the charted, NotamForChina, Joey0609 and
      #            Internet Archive histories, with their licence files. A run with no change uploads nothing.
      #   site     site/ as deployed: every published file, each replaced by the next deploy. Once the deploy step
      #            succeeded.
      # No source Launch reads takes a key, so nothing is redacted and the archived bytes match the files here.
      # Each lane is tried even if another failed; a missing token or any failed lane turns the run red after the
      # live site is updated.
      - name: Private archive (raw replies, run state, history and site, to tic-archive)
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.TIC_ARCHIVE_TOKEN }}
          COLLECTED: ${{ steps.collect.outcome }}
          DEPLOYED: ${{ steps.deploy.outcome }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::secret TIC_ARCHIVE_TOKEN is not set, so nothing went to the private archive"; exit 1
          fi
          failed=0
          if [ -d data/raw ]; then
            python tools/tic_archive.py put --program launch --lane raw --src data/raw || failed=1
          else
            echo "raw: collect fetched nothing this run, so there are no replies to archive"
          fi
          if [ "$COLLECTED" = "success" ]; then
            python tools/tic_archive.py put --program launch --lane state --src data --exclude 'raw/*' \
              --exclude 'release-copy/*' || failed=1
          else
            echo "state: collect did not succeed this run, so the state was not archived"
          fi
          python tools/tic_archive.py put --program launch --lane history --src history || failed=1
          if [ "$DEPLOYED" = "success" ]; then
            python tools/tic_archive.py put --program launch --lane site --src site || failed=1
          else
            echo "site: not deployed this run, so not archived"
          fi
          if [ "$failed" != 0 ]; then
            echo "::error::a lane did not reach the private archive this run (see above)"; exit 1
          fi
